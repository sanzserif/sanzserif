name: Update README Stats

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python-dateutil
        run: pip install python-dateutil

      - name: Generate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sanzserif
        run: python3 .github/scripts/generate_svg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-dark.svg profile-light.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile stats [skip ci]"
          git pull --rebase origin main
          git push
